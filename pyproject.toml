[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[project]
dependencies = [
  "mypy (>=1.18.2,<2.0.0)",
  "numpy (>=2.3.3,<3.0.0)",
  "pandas (>=2.3.3,<3.0.0)",
  "pre-commit (>=4.3.0,<5.0.0)",
  "pyqt6 (>=6.9.1,<7.0.0)",
  "pyqtgraph (>=0.13.7,<0.14.0)",
  "pyvisa (>=1.15.0,<2.0.0)",
  "pyvisa-sim (>=0.7.1,<0.8.0)",
  "ruff (>=0.14.0,<0.15.0)"
]
description = "Software for Magnetic Susceptibility Measurement Station Using the AC Method"
name = "msms"
readme = "README.md"
requires-python = ">=3.12"
version = "0.0.1"

[[project.authors]]
email = "mzepp@student.agh.edu.pl"
name = "Marcin Zepp"

[project.scripts]
msms = "msms.__main__:main"
test = "msms.tests.smoke:main"
ui = "msms.__main__:ui"

[tool.mypy]
plugins = []

[[tool.poetry.packages]]
include = "msms"

[tool.pre-commit-update]
warnings = true

[tool.pre-commit-update.yaml]
mapping = 2
offset = 2
sequence = 4

[tool.ruff]
extend-exclude = []
line-length = 120
target-version = "py312"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D212",
  "DOC201",
  "DOC402",
  "DOC501"
]
preview = true
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C",
  "COM",
  # "D", -- docstrings
  "DOC",
  "DTZ",
  "E",
  "EM",
  "F",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  # "T20", - ban print()
  "TC",
  "TID",
  "TRY",
  "UP",
  "W"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
extra-standard-library = []

[tool.ruff.lint.per-file-ignores]
"**/ui/*window.py" = ["N802"]

[tool.tomlsort]
all = true
ignore_case = true
in_place = true
